name: Build and Release Ki-Downloader

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Ki-Downloader Packages
        shell: powershell
        run: |
          ./build-installer.ps1

      - name: Publish GitHub Release v1.0.5
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: Ki-Downloader v1.0.5
          body: |
            ### Ki-Downloader v1.0.5

            **Fixes:**
            - Fixed `403 Forbidden` on signed/anti-hotlink video CDN links by adding browser `Sec-Ch-Ua` / `Sec-Fetch-*` headers, plain `GET` fallback (when `HEAD` and `Range: 0-0` are rejected), and automatic origin `Referer` fallback
            - Updated browser extension to forward browser `User-Agent`

            **Install (PowerShell):**
            ```powershell
            irm https://raw.githubusercontent.com/farzadzx1234/Ki-Downloader/main/install.ps1 | iex
            ```
            Or download **`Ki-Downloader-Portable.zip`**, extract it, and run **`Install.cmd`** (or launch **`Ki-Downloader.cmd`** directly).
          files: |
            dist/Ki-Downloader-Portable.zip
            dist/Ki-Downloader-Extension.zip
            dist/Ki-Downloader-Setup.exe
