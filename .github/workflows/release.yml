name: Build and Release Ki-Downloader

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Ki-Downloader and Windows Installer
        shell: powershell
        run: |
          ./build-installer.ps1

      - name: Publish GitHub Release v1.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Ki-Downloader v1.0.0
          body: |
            ### Ki-Downloader v1.0.0
            - Multi-stream parallel HTTP/HTTPS download engine (up to 32 sections)
            - Resilient disconnect recovery, stall watchdog, and dynamic work-stealing
            - Liquid Glass UI with Light & Dark themes, spring physics, and FA/EN RTL/LTR support
            - Native SOCKS5 & HTTP/HTTPS proxy profile manager + Encrypted DNS (DoH)
            - Global & per-download speed limiter + Night Scheduler
            - Standalone Chrome/Edge Browser Extension (`Ki-Downloader-Extension.zip`)
          files: |
            dist/Ki-Downloader-Setup.exe
            dist/Ki-Downloader-Extension.zip
