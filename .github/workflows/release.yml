name: Build and Release Ki-Downloader

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Ki-Downloader Packages
        shell: powershell
        run: |
          ./build-installer.ps1

      - name: Publish GitHub Release v1.0.2
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: Ki-Downloader v1.0.2
          body: |
            ### Ki-Downloader v1.0.2

            **Fixes & Improvements:**
            - Fixed `Ctrl+V` clipboard capture across both Persian (`FA`) and English (`EN`) keyboard layouts + added global paste handler
            - Automatic URL probing & metadata extraction (`filename`, `type/category`, `size`, `resume support`) when typing or pasting a link manually
            - Improved Light Mode Liquid Glass contrast, frosted depth, and active sliding pill visibility
            - Redesigned unified Apple Liquid Glass top window control bar & glossy traffic-light controls (including maximize/restore state)
            - Centered search orb & icon alignment pixel-perfectly

            **Recommended Install (No SmartScreen / Unknown Publisher warning):**
            ```powershell
            irm https://raw.githubusercontent.com/farzadzx1234/Ki-Downloader/main/install.ps1 | iex
            ```
            Or download **`Ki-Downloader-Portable.zip`**, extract it, and run **`Install.cmd`** (or launch `Ki-Downloader.exe` directly).
          files: |
            dist/Ki-Downloader-Portable.zip
            dist/Ki-Downloader-Extension.zip
            dist/Ki-Downloader-Setup.exe
