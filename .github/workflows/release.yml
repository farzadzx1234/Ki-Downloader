name: Build and Release Ki-Downloader

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Ki-Downloader Packages
        shell: powershell
        run: |
          ./build-installer.ps1

      - name: Publish GitHub Release v1.0.3
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: Ki-Downloader v1.0.3
          body: |
            ### Ki-Downloader v1.0.3

            **Recommended Install (Works cleanly even with Windows 11 Smart App Control / SmartScreen ON):**
            ```powershell
            irm https://raw.githubusercontent.com/farzadzx1234/Ki-Downloader/main/install.ps1 | iex
            ```
            Or download **`Ki-Downloader-Portable.zip`**, extract it, and run **`Install.cmd`** (or launch **`Ki-Downloader.cmd`** directly).

            - Automatic Smart App Control-safe launch using signed PowerShell + Microsoft WebView2 runtime when unsigned `.exe` binaries are restricted by Windows policy
            - Fixed `Ctrl+V` clipboard capture across both Persian (`FA`) and English (`EN`) layouts
            - Automatic URL probing & metadata extraction (`filename`, `type/category`, `size`, `resume support`)
            - Crisp Light Mode Liquid Glass, unified Apple window controls, and centered search orb
          files: |
            dist/Ki-Downloader-Portable.zip
            dist/Ki-Downloader-Extension.zip
            dist/Ki-Downloader-Setup.exe
