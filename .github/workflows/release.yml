name: Build and Release Ki-Downloader

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Ki-Downloader Packages
        shell: powershell
        run: |
          ./build-installer.ps1

      - name: Publish GitHub Release v1.0.11
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.11
          name: Ki-Downloader v1.0.11
          body: |
            ### Ki-Downloader v1.0.11

            **Fixes & Improvements:**
            - Fixed UI click drops and card flickering across download list & Inspector info sheet by diffing DOM children and updating stats in-place instead of rebuilding DOM every 400ms
            - Fixed Inspector Pause/Resume button status check for Queued/Probing/Merging states
            - Hardened Pause/Resume cancellation with run generation guards (`_itemRunGen`), request-first abort order, and `Task.WhenAny` socket read cancellation for zero post-pause traffic
            - Reduced redundant state pushes in `MainWindow` when idle/unchanged

            **Install (PowerShell):**
            ```powershell
            irm https://raw.githubusercontent.com/farzadzx1234/Ki-Downloader/main/install.ps1 | iex
            ```
            Or download **`Ki-Downloader-Portable.zip`**, extract it, and run **`Install.cmd`** (or launch **`Ki-Downloader.cmd`** directly).
          files: |
            dist/Ki-Downloader-Portable.zip
            dist/Ki-Downloader-Extension.zip
            dist/Ki-Downloader-Setup.exe
