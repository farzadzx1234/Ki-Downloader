name: Build and Release Ki-Downloader

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Ki-Downloader Packages
        shell: powershell
        run: |
          ./build-installer.ps1

      - name: Publish GitHub Release v1.0.8
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8
          name: Ki-Downloader v1.0.8
          body: |
            ### Ki-Downloader v1.0.8

            **Fixes & Improvements:**
            - Replaced legacy WinForms tray menu with a custom Windows 11 rounded popup card (`TrayPopupForm`)
            - Added live download status header, Clipboard Monitor toggle switch, Downloads Folder shortcut, crisp outline icons, and Dark/Light + FA/EN support

            **Install (PowerShell):**
            ```powershell
            irm https://raw.githubusercontent.com/farzadzx1234/Ki-Downloader/main/install.ps1 | iex
            ```
            Or download **`Ki-Downloader-Portable.zip`**, extract it, and run **`Install.cmd`** (or launch **`Ki-Downloader.cmd`** directly).
          files: |
            dist/Ki-Downloader-Portable.zip
            dist/Ki-Downloader-Extension.zip
            dist/Ki-Downloader-Setup.exe
