name: Build and Release Ki-Downloader

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Ki-Downloader Packages
        shell: powershell
        run: |
          ./build-installer.ps1

      - name: Publish GitHub Release v1.0.9
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.9
          name: Ki-Downloader v1.0.9
          body: |
            ### Ki-Downloader v1.0.9

            **Fixes & Improvements:**
            - Bundled Vazirmatn TTF (`Vazirmatn-Regular.ttf` / `Vazirmatn-Bold.ttf`) and loaded via GDI+ `PrivateFontCollection` in `TrayPopupForm` for crisp Persian & English typography
            - Improved RTL text direction for live tray status badge

            **Install (PowerShell):**
            ```powershell
            irm https://raw.githubusercontent.com/farzadzx1234/Ki-Downloader/main/install.ps1 | iex
            ```
            Or download **`Ki-Downloader-Portable.zip`**, extract it, and run **`Install.cmd`** (or launch **`Ki-Downloader.cmd`** directly).
          files: |
            dist/Ki-Downloader-Portable.zip
            dist/Ki-Downloader-Extension.zip
            dist/Ki-Downloader-Setup.exe
